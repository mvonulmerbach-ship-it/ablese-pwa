<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ablese-Erfassung</title>
<meta name="description" content="Zählerstände erfassen und ans Ablese-Postfach übertragen.">
<link rel="manifest" href="manifest.json">
<!-- v0.50.40: Vektor zuerst, die PNG bleiben der Rueckfall. Das Zeichen
     ist das SCHILD der Mietverwaltung — dieselbe Marke wie dort, hier
     mit dem Tropfen-Abzeichen, damit die beiden auf EINEM
     Startbildschirm unterscheidbar bleiben. -->
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f9f8f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ablesung">
<!-- UI-Uebernahme 31.08.2026: beide Token-Dateien byte-gleich aus der
     Mietverwaltung (frontend/). Die dunkle wirkt NUR unter
     [data-theme="dark"] am <html>-Element — gesetzt von js/theme.js,
     das im <head> laeuft, damit ein gemerktes dunkles Design ohne
     hellen Blitz erscheint. -->
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="ui-tokens-dark.css">
<link rel="stylesheet" href="app.css">
<script src="js/theme.js"></script>
</head>
<body>
<header>
  <div class="kopf-titel">
    <h1>Ablese-Erfassung</h1>
    <p id="konto-zeile" class="konto-zeile" hidden></p>
  </div>
  <!-- Gleiche Bauart wie am Master: Mond in Ruhe, Sonne im Dunkelmodus,
       Umschaltung in js/theme.js. -->
  <button type="button" id="theme-umschalten" class="theme-umschalter" aria-pressed="false"
          onclick="themeUmschalten()" title="Dunkles Design">
    <svg class="ic-svg icon-mond" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <svg class="ic-svg icon-sonne" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2"></path><path d="M12 20v2"></path>
      <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
      <path d="M2 12h2"></path><path d="M20 12h2"></path>
      <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
    </svg>
  </button>
</header>

<main>
  <section id="anmelden-bereich">
    <p>Zum Erfassen von Zählerständen bitte mit deinem Microsoft-Konto anmelden.</p>
    <button id="btn-anmelden" class="btn-primaer">Mit Microsoft anmelden</button>
    <p id="anmelden-fehler" class="fehler" hidden></p>
  </section>

  <section id="app-bereich" hidden>
    <div id="reiter-leiste" class="leiste">
      <button type="button" id="reiter-erfassen" class="btn-reiter btn-reiter-aktiv">Erfassen</button>
      <button type="button" id="reiter-nachsehen" class="btn-reiter">Nachsehen</button>
    </div>

    <div id="erfassen-bereich">
      <p id="zaehlerliste-stand" class="hinweis">Zählerliste wird geladen …</p>

      <div id="warteschlangen-leiste" class="leiste">
        <span id="warteschlange-text">Keine Einträge in der Warteschlange.</span>
        <button id="btn-jetzt-senden" class="btn-sekundaer" hidden>Jetzt senden</button>
      </div>
      <p id="offline-hinweis" class="hinweis hinweis-warnung" hidden>
        Kein Netz — Einträge werden lokal gespeichert und beim nächsten Öffnen/Senden übertragen.
      </p>
      <!-- 09.09.2026: Grund eines fehlgeschlagenen Sendens. Text kommt aus
           app.js::zeigeSendeFehler; bis dahin landete jeder Fehlschlag nur
           in der Browser-Konsole und war am Handy unsichtbar. -->
      <p id="sende-fehler" class="hinweis hinweis-fehler" hidden></p>

      <div id="erfassung-kopf">
        <label>Datum
          <input type="date" id="feld-datum">
        </label>
        <label>Anlass
          <select id="feld-anlass"></select>
        </label>
      </div>

      <div id="einheiten-liste"></div>
    </div>

    <!-- A5 (v0.49.169): reiner Lese-Bereich -- "Daten, keine Funktionen"
         (Konzept). Nichts hier legt an, rechnet oder loest etwas aus. -->
    <!-- 09.09.2026: aus den drei flachen Listen wird eine Ebene-fuer-Ebene-
         Navigation (NK-Kreis -> Einheit -> Detail). Grund: unterwegs sucht
         man EINE Einheit, und drei lange Listen untereinander heisst
         scrollen statt finden. Der Bereich ist weiterhin reines Lesen --
         nichts hier legt an, rechnet oder loest etwas aus. Gezeichnet wird
         alles aus app.js in #nachsehen-inhalt; die Kopfzeile darueber
         traegt Zurueck-Knopf, Ort und Datenstand. -->
    <div id="nachsehen-bereich" hidden>
      <div id="nachsehen-kopf">
        <button type="button" id="nachsehen-zurueck" class="btn-zurueck" hidden></button>
        <div class="nachsehen-titelblock">
          <h2 id="nachsehen-titel">Objekte</h2>
          <p id="nachsehen-unterzeile" class="nachsehen-unterzeile"></p>
        </div>
      </div>
      <p id="nachsehen-stand" class="hinweis">Wird geladen …</p>
      <div id="nachsehen-inhalt"></div>
    </div>
  </section>

  <section id="lade-bereich" class="hinweis">
    <p>Lädt …</p>
  </section>
</main>

<script src="vendor/msal/msal-browser.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/config.js"></script>
<script src="js/zahl.js"></script>
<script src="js/queue.js"></script>
<script src="js/auth.js"></script>
<script src="js/graph.js"></script>
<script src="js/app.js"></script>
</body>
</html>
